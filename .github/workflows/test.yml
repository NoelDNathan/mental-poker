name: Rust security baseline

on:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RUST_BACKTRACE: 1

jobs:
  runtime:
    name: Native tests and browser target
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pinned dependency graph
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Show pinned toolchain
        run: rustc --version --verbose

      - name: Check browser runtime
        run: cargo check --locked -p wasm_client --target wasm32-unknown-unknown

      - name: Test authority and recovery logic
        run: cargo test --locked -p wasm_client --lib

  audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned dependency graph
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit exact dependency graph
        run: cargo audit
