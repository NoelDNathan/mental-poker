[workspace]
resolver = "2"

members = [
    "barnett-smart-card-protocol",
    "babyjubjub", 
    "proof-essentials", 
    "texas-holdem", 
    "WebRTC-in-Rust/wasm_client",
    "WebRTC-in-Rust/signalling-server", 
    "WebRTC-in-Rust/shared-protocol",
        "workspace-ark05/circom-witnesscalc",
    #"WebRTC-in-Rust/turn-server"
]

# lego-prover (ark 0.4) declara su propio [workspace] para aislar ark 0.4 del
# resto (ark 0.5/0.3). Lo excluimos aqui para que cargo no lo trate como un
# segundo "workspace root" al resolver el grafo de barnett->zk-reshuffle->lego.
# Sigue siendo usable como path-dependency.
exclude = [
    "lego-prover",
]

# Arkworks 0.3 and 0.5 still pin tracing-subscriber 0.2 through their `std`
# feature. That line is affected by RUSTSEC-2025-0055. These source-identical,
# locally reviewed shims only raise that dependency to the patched 0.3 API.
[patch.crates-io]
ark-relations-03 = { package = "ark-relations", path = "vendor/ark-relations-0.3.0" }
ark-relations-05 = { package = "ark-relations", path = "vendor/ark-relations-0.5.1" }
