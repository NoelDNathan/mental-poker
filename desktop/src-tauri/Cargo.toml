# Spike de app de escritorio (Tauri v2): prover NATIVO del pool de precompute.
# Miembro del workspace raiz: un solo Cargo.lock y un solo grafo de features
# con poker-precompute/wasm_client (compartir target/ entre workspaces distintos
# mezclaba artefactos con features distintas).
[package]
name = "dpc-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Spike Tauri v2: genera en nativo las entradas del pool de precompute ZK."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
poker-precompute = { path = "../../poker-precompute" }
# Solo para nombrar el tipo `CardParameters` (poker-precompute no lo reexporta).
texas-holdem = { path = "../../texas-holdem" }
# Hash de engine.html (ruta por contenido del nucleo, bloque 2.2). Ya esta en Cargo.lock.
sha2 = "0.10"
